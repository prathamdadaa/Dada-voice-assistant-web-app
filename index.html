<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dada Voice Assistant - Code with Dada</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --border: #30363d;
      --user-msg: #1f6feb;
      --bot-msg: #21262d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: 85vh;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .header {
      padding: 20px;
      background: #090d13;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .header h1 {
      color: var(--accent);
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 0.85rem;
      color: #8b949e;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-msg);
      color: var(--text-bright);
      border-bottom-right-radius: 2px;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bot-msg);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    .chips-container {
      padding: 10px 20px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-top: 1px solid var(--border);
      background: #0d1117;
    }

    .chip {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      background: var(--accent);
      color: #fff;
    }

    .controls {
      padding: 15px 20px;
      background: #090d13;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      background: #161b22;
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 12px 16px;
      border-radius: 24px;
      outline: none;
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 24px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .mic-btn {
      background: #238636;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
    }

    .mic-btn.listening {
      background: #da3633;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🤖 Dada Voice Assistant</h1>
      <p>Powered by Code with Dada | Bolkar ya Likhkar Pucho</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">
        नमस्ते भाई! मैं आपका दादा Voice Assistant हूँ। कोडिंग, वेब डेवलपमेंट या कोई भी सामान्य सवाल पूछिए!
      </div>
    </div>

    <div class="chips-container" id="chipsContainer"></div>

    <div class="controls">
      <input type="text" id="userInput" placeholder="यहाँ लिखें या माइक से बोलें..." onkeydown="if(event.key==='Enter') handleSend()">
      <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎙️</button>
      <button onclick="handleSend()">Send</button>
    </div>
  </div>

  <script>
    /* ---------- Config ---------- */
    const PITCH = 0.85, RATE = 0.95;
    const CHIPS = [
      'नमस्ते', 'HTML क्या है?', 'CSS क्या है?', 'JavaScript क्या है?',
      'Python क्या है?', 'C++ क्या है?', 'React kya hai?', 'DSA kya hai?', 'तुझे किसने बनाया?'
    ];
    const FALLBACK = 'हाँ भाई, मैं समझ रहा हूँ! कोडिंग, HTML, CSS, Python, C++, React ya kisi bhi software topic ke bare me poochiye!';

    /* ---------- Helper Functions ---------- */
    const has = (text, keywords) => keywords.some(k => text.includes(k));
    const word = (text, words) => {
      const tokens = text.split(/\s+/);
      return words.some(w => tokens.includes(w));
    };
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];

    const timeReply = () => {
      const now = new Date();
      return `अभी समय ${now.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' })} हुआ है।`;
    };

    const dateReply = () => {
      const now = new Date();
      return `आज ${now.toLocaleDateString('hi-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} है।`;
    };

    const jokes = [
      'एक डेवलपर ने अपनी गर्लफ्रेंड से कहा: तुम मेरी जिंदगी का Bug नहीं, Feature हो!',
      'चाय और कोड दोनों अगर ठंडे हो जाएं, तो दोबारा गर्म करने में मज़ा नहीं आता!',
      'जब तक कोड चल रहा है, तब तक उसे हाथ मत लगाओ — यह दुनिया का पहला नियम है!'
    ];
    let jokeIdx = 0;
    const nextJoke = () => {
      const j = jokes[jokeIdx % jokes.length];
      jokeIdx++;
      return j;
    };

    /* ---------- Core Intent Dictionary ---------- */
    const INTENTS = [
      // Greetings & Goodbyes
      {
        name: 'greeting',
        test: t => word(t, ['hi', 'hello', 'hey', 'namaste', 'namaskar', 'hii', 'hlo', 'नमस्ते', 'नमस्कार', 'हेलो', 'हैलो', 'हाय', 'हे', 'प्रणाम', 'राम']) || has(t, ['good morning', 'good evening', 'good afternoon', 'সুপ্রভাত', 'राम राम', 'kya hal', 'kaise ho']),
        reply: () => pick(['हेलो भाई! क्या हाल चाल हैं?', 'नमस्ते जी! दादा हाज़िर है, बोलिए क्या सेवा करूँ?', 'अरे वाह, आप आ गए! हेलो हेलो, कैसे हैं?'])
      },
      {
        name: 'bye',
        test: t => word(t, ['bye', 'tata', 'baye', 'alvida', 'बाय', 'टाटा', 'अलविदा', 'cya']) || has(t, ['see you', 'good night', 'phir milte', 'फिर मिलते', 'चलता हूँ', 'chalta hu', 'शुभ रात्रि', 'baad me milte']),
        reply: () => pick(['अलविदा भाई! अपना ध्यान रखना, फिर मिलेंगे!', 'टाटा! जब भी मन करे, दादा हमेशा यहाँ है।', 'ठीक है भाई, फिर मिलते हैं! आपका दिन शानदार रहे!'])
      },
      {
        name: 'wellbeing',
        test: t => has(t, ['kaise ho', 'kaisa hai', 'kaise hain', 'kya haal', 'kya hal', 'how are you', 'how r u', 'whats up', 'sab theek', 'कैसे हो', 'कैसे हैं', 'कैसा है', 'क्या हाल', 'सब ठीक', 'कैसी चल']),
        reply: () => pick(['मैं एकदम बढ़िया और फुल जोश में हूँ! आप सुनाइए, कैसे हैं?', 'बिल्कुल मस्त हूँ भाई! आपसे बात करके और भी अच्छा लग रहा है।'])
      },
      {
        name: 'creator',
        test: t => has(t, ['kisne banaya', 'kaun banaya', 'kisne bnaya', 'who made you', 'who created', 'who built', 'creator', 'developer', 'pratham', 'ignou', 'किसने बनाया', 'कौन बनाया', 'बनाने वाला', 'डेवलपर', 'प्रथम', 'इग्नू', 'इग्नो', 'your maker', 'made you']) || word(t, ['bca', 'बीसीए']),
        reply: () => 'मुझे प्रथम दादा ने बनाया है! वे IGNOU से BCA (बैचलर ऑफ़ कंप्यूटर एप्लिकेशंस) के पहले साल के छात्र हैं और एक जुनूनी सॉफ़्टवेयर डेवलपर हैं। मुझे अपने क्रिएटर पर बहुत गर्व है!'
      },
      {
        name: 'name',
        test: t => has(t, ['tumhara naam', 'tera naam', 'aapka naam', 'your name', 'who are you', 'तुम्हारा नाम', 'तेरा नाम', 'आपका नाम', 'कौन हो', 'कौन हैं आप', 'तुम कौन']),
        reply: () => 'मेरा नाम दादा है! मैं आपका AI वॉइस असिस्टेंट हूँ, जो आपसे हिंदी और हिंग्लिश में बात कर सकता हूँ।'
      },

      // Core Programming Languages
      {
        name: 'html',
        test: t => has(t, ['html kya', 'what is html', 'html ke bare', 'html kya hota', 'एचटीएमएल']),
        reply: () => 'HTML का मतलब HyperText Markup Language है। यह किसी भी वेबसाइट का ढांचा या स्केलेटन (Skeleton) बनाने के काम आता है।'
      },
      {
        name: 'css',
        test: t => has(t, ['css kya', 'what is css', 'css ke bare', 'css kya hota', 'सीएसएस']),
        reply: () => 'CSS का मतलब Cascading Style Sheets है। यह वेबपेज को सुंदर बनाने, लेआउट सेट करने और डिज़ाइनिंग के काम आता है।'
      },
      {
        name: 'javascript',
        test: t => has(t, ['javascript kya', 'js kya', 'what is javascript', 'js kya hota', 'जावास्क्रिप्ट']),
        reply: () => 'JavaScript एक बहुत ही पावरफुल प्रोग्रामिंग लैंग्वेज है जो वेबपेज में जान डालती है और वेबसाइट्स को इंटरेक्टिव बनाती है।'
      },
      {
        name: 'typescript',
        test: t => has(t, ['typescript kya', 'ts kya', 'what is typescript']),
        reply: () => 'TypeScript जावास्क्रिप्ट का ही एक strongly typed रूप है, जो बड़े प्रोजेक्ट्स में कोड की गलतियों को पहले ही पकड़ने में मदद करता है।'
      },
      {
        name: 'python',
        test: t => has(t, ['python kya', 'what is python', 'python ke bare', 'पायथन']),
        reply: () => 'Python एक बहुत ही आसान और लोकप्रिय भाषा है। इसका उपयोग AI, मशीन लर्निंग, डेटा साइंस और वेब बैकएंड में व्यापक रूप से होता है।'
      },
      {
        name: 'cpp',
        test: t => has(t, ['c++ kya', 'cpp kya', 'c plus plus', 'what is c++', 'सी प्लस प्लस']),
        reply: () => 'C++ एक हाई-परफॉर्मेंस लैंग्वेज है। इसका इस्तेमाल गेम डेवलपमेंट, ऑपरेटिंग सिस्टम, डेटा स्ट्रक्चर्स और कॉम्पिटिटिव प्रोग्रामिंग में स्पीड के लिए होता है।'
      },
      {
        name: 'java',
        test: t => has(t, ['java kya', 'what is java', 'java language', 'जावा क्या']),
        reply: () => 'Java एक ऑब्जेक्ट-ओरिएंटेड प्रोग्रामिंग लैंग्वेज है। इसका इस्तेमाल Android ऐप्स, बड़े एंटरप्राइज सॉफ्टवेयर और बैकएंड सिस्टम बनाने में होता है।'
      },
      {
        name: 'sql',
        test: t => has(t, ['sql kya', 'database kya', 'what is sql', 'dbms kya', 'एसक्यूएल']),
        reply: () => 'SQL यानी Structured Query Language! इसका इस्तेमाल relational databases में डेटा को स्टोर, सर्च, अपडेट और मैनेज करने के लिए किया जाता है।'
      },

      // Frameworks & Libraries
      {
        name: 'react',
        test: t => has(t, ['react kya', 'reactjs kya', 'what is react', 'रिएक्ट']),
        reply: () => 'React Meta द्वारा बनाई गई एक लोकप्रिय JavaScript लाइब्रेरी है, जिसका इस्तेमाल तेज़ और dynamic user interface (UI) बनाने के लिए किया जाता है।'
      },
      {
        name: 'nextjs',
        test: t => has(t, ['nextjs kya', 'next js kya', 'what is nextjs']),
        reply: () => 'Next.js React का एक पॉपुलर फ्रेमवर्क है जो server-side rendering (SSR) और static site generation (SSG) की सुविधा देता है, जिससे SEO बेहतरीन होता है।'
      },
      {
        name: 'node',
        test: t => has(t, ['nodejs kya', 'node js', 'node kya', 'नोड']),
        reply: () => 'Node.js एक JavaScript runtime environment है, जो जावास्क्रिप्ट को ब्राउज़र के बाहर backend server पर चलाने की अनुमति देता है।'
      },
      {
        name: 'express',
        test: t => has(t, ['expressjs kya', 'express js kya', 'what is express']),
        reply: () => 'Express.js Node.js का एक हल्का और तेज़ वेब एप्लीकेशन फ्रेमवर्क है, जो REST APIs और वेब सर्वर बनाने के काम आता है।'
      },
      {
        name: 'tailwind',
        test: t => has(t, ['tailwind kya', 'tailwind css', 'what is tailwind']),
        reply: () => 'Tailwind CSS एक utility-first CSS फ्रेमवर्क है जो आपको बिना अलग CSS फाइल लिखे, सीधे HTML क्लासेज के जरिए तेजी से डिज़ाइन बनाने में मदद करता है।'
      },

      // Core CS Concepts
      {
        name: 'dsa',
        test: t => has(t, ['dsa kya', 'data structure', 'algorithms kya', 'डीएसए']),
        reply: () => 'DSA यानी Data Structures and Algorithms! यह कंप्यूटर साइंस की नींव है जो कोड को फ़ास्ट, कुशल और मेमोरी-फ्रेंडली बनाने में मदद करता है।'
      },
      {
        name: 'git',
        test: t => has(t, ['git kya', 'github kya', 'what is git', 'version control', 'गिट']),
        reply: () => 'Git एक वर्जन कंट्रोल सिस्टम है जो कोड के इतिहास का हिसाब रखता है, और GitHub कोड को क्लाउड पर स्टोर और टीम के साथ शेयर करने का प्लेटफॉर्म है।'
      },
      {
        name: 'api',
        test: t => has(t, ['api kya', 'what is api', 'rest api kya']),
        reply: () => 'API (Application Programming Interface) दो अलग-अलग सॉफ्टवेयर या एप्लिकेशन के बीच डेटा का आदान-प्रदान करने का ज़रिया है।'
      },
      {
        name: 'linux',
        test: t => has(t, ['linux kya', 'what is linux', 'operating system']),
        reply: () => 'Linux एक open-source और बहुत ही सुरक्षित ऑपरेटिंग सिस्टम है, जिसका उपयोग दुनिया भर के ज्यादातर Servers और Cloud Architecture में होता है।'
      },

      // Utility & Friendly Chat
      {
        name: 'time',
        test: t => has(t, ['time kya', 'kitne baje', 'kya time', 'current time', 'what time', 'टाइम', 'समय', 'कितने बजे', 'बजे हैं', 'kitna baja']) || word(t, ['time', 'samay']),
        reply: timeReply
      },
      {
        name: 'date',
        test: t => has(t, ['date kya', 'aaj ki date', 'aaj ka din', 'aaj kya din', 'tarikh', 'tareekh', 'what day', 'todays date', 'तारीख', 'तारिख', 'आज का दिन', 'आज की डेट', 'डेट']) || word(t, ['date', 'din', 'दिन']),
        reply: dateReply
