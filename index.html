<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dada – Voice Assistant</title>
<style>
:root {
  --blue: #1a73e8;
  --navy: #0d47a1;
  --tint: #e8f0fe;
  --white: #ffffff;
  --ink: #0b2a55;
  --muted: #5b7191;
  --line: #d2e3fc;
  --bg-gradient: linear-gradient(180deg, #e8f0fe 0%, #ffffff 100%);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* 1. Viewport & Body Auto-Adjust */
html, body {
  width: 100%;
  height: 100%;
  height: 100dvh; /* Dynamic Viewport Height for mobile browsers */
  overflow: hidden; /* Prevents double scrolling */
}

body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", "Nirmala UI", sans-serif;
  background: #f0f4f9;
  color: var(--ink);
  line-height: 1.5;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 2. Responsive App Wrapper */
.app {
  width: 100%;
  height: 100%;
  max-width: 768px; /* Ideal for Desktop & Tablets */
  display: flex;
  flex-direction: column;
  padding: 16px 18px;
  gap: 12px;
  background: var(--white);
}

/* Desktop Desktop Outer Card styling */
@media (min-width: 769px) {
  .app {
    height: 94vh;
    max-height: 900px;
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(13, 71, 161, 0.12);
    border: 1px solid var(--line);
  }
}

/* Header Adjustments */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding-bottom: 4px;
}

h1 {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -.02em;
  color: var(--navy);
}

h1 small {
  display: block;
  font-size: .8rem;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--muted);
}

.tools {
  display: flex;
  gap: 8px;
  align-items: center;
}

select, .ghost {
  font: inherit;
  font-size: .85rem;
  color: var(--navy);
  background: var(--tint);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px;
  max-width: 180px;
  cursor: pointer;
}

select:hover, .ghost:hover {
  border-color: var(--blue);
}

:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 2px;
}

/* 3. Stage (Mic & Visualizer) */
.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}

.mic-wrap {
  position: relative;
  width: 110px;
  height: 110px;
  display: grid;
  place-items: center;
}

.mic-wrap::before, .mic-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--blue);
  opacity: 0;
  transform: scale(.8);
}

.mic {
  position: relative;
  z-index: 1;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  border: 0;
  cursor: pointer;
  background: var(--blue);
  color: #fff;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 24px rgba(26,115,232,.35);
  transition: transform .15s, background .2s;
  animation: breathe 3s ease-in-out infinite;
}

.mic:hover { transform: scale(1.05); }
.mic:active { transform: scale(.95); }
.mic svg { width: 36px; height: 36px; }

@keyframes breathe {
  0%, 100% { box-shadow: 0 8px 24px rgba(26,115,232,.35); }
  50% { box-shadow: 0 8px 32px rgba(26,115,232,.55); }
}

@keyframes ripple {
  0% { opacity: .35; transform: scale(.75); }
  100% { opacity: 0; transform: scale(1.35); }
}

.listening .mic { background: var(--navy); animation: none; }
.listening .mic-wrap::before { animation: ripple 1.6s ease-out infinite; }
.listening .mic-wrap::after { animation: ripple 1.6s ease-out .8s infinite; }
.speaking .mic { animation: none; background: var(--blue); }
.speaking .mic-wrap::before { animation: ripple 1.1s ease-out infinite; }

/* Visualizer Wave */
.wave {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 28px;
}

.wave i {
  display: block;
  width: 4px;
  height: 6px;
  border-radius: 3px;
  background: var(--blue);
  opacity: .35;
  transition: opacity .2s;
}

.wave i:nth-child(3n) { background: var(--navy); }
.listening .wave i, .speaking .wave i {
  opacity: 1;
  animation: bar .9s ease-in-out infinite;
  animation-delay: calc(var(--i) * -.11s);
}

@keyframes bar {
  0%, 100% { height: 6px; }
  50% { height: calc(12px + var(--h) * 0.8px); }
}

.status {
  font-size: .9rem;
  font-weight: 600;
  color: var(--navy);
  text-align: center;
}

.live {
  font-size: .85rem;
  color: var(--muted);
  min-height: 1.2em;
  text-align: center;
  font-style: italic;
  max-width: 90%;
}

/* 4. Scrollable Chips Container */
.chips-wrap {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: none; /* Firefox */
  padding: 2px 0;
}
.chips-wrap::-webkit-scrollbar { display: none; } /* Chrome/Safari */

.chips {
  display: flex;
  gap: 8px;
  white-space: nowrap;
  justify-content: flex-start;
}

@media (min-width: 600px) {
  .chips { justify-content: center; flex-wrap: wrap; }
}

.chip {
  font: inherit;
  font-size: .82rem;
  color: var(--navy);
  background: var(--tint);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .15s, color .15s;
}

.chip:hover {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

/* 5. Chat Box (Flexible Height) */
.chat-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--tint);
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  min-height: 180px;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  max-width: 85%;
  padding: 9px 14px;
  border-radius: 16px;
  font-size: .92rem;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg.bot {
  align-self: flex-start;
  background: var(--white);
  color: var(--ink);
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}

.msg.user {
  align-self: flex-end;
  background: var(--blue);
  color: #fff;
  border-bottom-right-radius: 4px;
}

/* Text Input Form */
form {
  display: flex;
  gap: 8px;
  padding: 8px 10px;
  background: var(--white);
  border-top: 1px solid var(--line);
}

form input {
  flex: 1;
  font: inherit;
  font-size: .9rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 14px;
  color: var(--ink);
  background: #f8fbff;
}

form input:focus {
  outline: 2px solid var(--blue);
  background: #fff;
}

form button {
  font: inherit;
  font-size: .88rem;
  font-weight: 600;
  color: #fff;
  background: var(--navy);
  border: 0;
  border-radius: 999px;
  padding: 8px 18px;
  cursor: pointer;
}

form button:hover { background: var(--blue); }

.note {
  font-size: .75rem;
  color: var(--muted);
  text-align: center;
}

/* Mobile Screen Adjustments */
@media (max-width: 480px) {
  .app { padding: 12px 12px; gap: 10px; }
  h1 { font-size: 1.3rem; }
  .mic-wrap { width: 95px; height: 95px; }
  .mic { width: 76px; height: 76px; }
  .mic svg { width: 30px; height: 30px; }
  select { max-width: 130px; font-size: .78rem; }
}
</style>
</head>
<body>
<main class="app" id="app">
  <header>
    <h1>Dada <small>आपका आवाज़ वाला दोस्त</small></h1>
    <div class="tools">
      <select id="voiceSelect" aria-label="Voice"></select>
      <button class="ghost" id="muteBtn" type="button" aria-pressed="false">Sound on</button>
    </div>
  </header>

  <section class="stage" aria-live="polite">
    <div class="mic-wrap">
      <button class="mic" id="micBtn" type="button" aria-label="Start or stop listening">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7"/>
        </svg>
      </button>
    </div>
    <div class="wave" id="wave" aria-hidden="true"></div>
    <div class="status" id="status">माइक दबाकर बोलिए</div>
    <div class="live" id="live"></div>
  </section>

  <div class="chips-wrap">
    <div class="chips" id="chips"></div>
  </div>

  <section class="chat-card">
    <div class="chat" id="chat" role="log" aria-label="Conversation"></div>
    <form id="form" autocomplete="off">
      <input id="textIn" type="text" placeholder="या यहाँ टाइप कीजिए…" aria-label="Type a message">
      <button type="submit">Send</button>
    </form>
  </section>
  <p class="note" id="note"></p>
</main>

<script>
(() => {
  'use strict';

  /* ---------- Config ---------- */
  const PITCH = 0.85, RATE = 0.95;
  const CHIPS = ['नमस्ते', 'कैसे हो?', 'तुझे किसने बनाया?', 'टाइम क्या हुआ?', 'आज की तारीख', 'चुटकुला सुनाओ'];
  const FALLBACK = 'हाँ भाई, मैं आपकी बात समझ रहा हूँ! बताइए और क्या बातचीत करनी है?';

  /* ---------- Elements ---------- */
  const $ = id => document.getElementById(id);
  const app = $('app'), micBtn = $('micBtn'), statusEl = $('status'), liveEl = $('live'),
        chat = $('chat'), voiceSel = $('voiceSelect'), muteBtn = $('muteBtn'),
        form = $('form'), textIn = $('textIn'), note = $('note');

  /* ---------- Visualizer bars + chips ---------- */
  const hs = [18, 30, 22, 36, 26, 34, 20, 30, 16];
  $('wave').innerHTML = hs.map((h, i) => `<i style="--i:${i};--h:${h}"></i>`).join('');
  CHIPS.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = t;
    b.addEventListener('click', () => handleInput(t));
    $('chips').appendChild(b);
  });

  /* ---------- State ---------- */
  let state = 'idle', muted = false, voices = [];
  const synth = window.speechSynthesis || null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;

  const LABELS = {
    idle: 'माइक दबाकर बोलिए',
    listening: 'सुन रहा हूँ…',
    speaking: 'बोल रहा हूँ…'
  };
  function setState(s) {
    state = s;
    app.classList.toggle('listening', s === 'listening');
    app.classList.toggle('speaking', s === 'speaking');
    statusEl.textContent = LABELS[s];
    if (s !== 'listening') liveEl.textContent = '';
  }

  /* ---------- Chat ---------- */
  function addMsg(who, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  /* ---------- Voices (prefer male) ---------- */
  const MALE_RE = /\b(male|david|mark|james|george|ravi|hemant|madhur|prabhat|guy|daniel|alex|fred|rishi|aaron|arthur|thomas|ryan|brian|christopher|eric|steven|rocko|oliver|gordon|diego|jorge|reed|eddy)\b/i;
  const isMale = v => MALE_RE.test(v.name) && !/female/i.test(v.name);

  function loadVoices() {
    if (!synth) return;
    voices = synth.getVoices();
    if (!voices.length) return;
    const keep = voiceSel.value || safeGet('dada.voice');
    const rank = v => (/^hi/i.test(v.lang) ? 0 : /^en-IN/i.test(v.lang) ? 1 : /^en/i.test(v.lang) ? 2 : 3);
    const male = voices.filter(isMale).sort((a, b) => rank(a) - rank(b));
    const other = voices.filter(v => !isMale(v)).sort((a, b) => rank(a) - rank(b));
    const opt = v => `<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`;
    voiceSel.innerHTML =
      (male.length ? `<optgroup label="Male voices">${male.map(opt).join('')}</optgroup>` : '') +
      `<optgroup label="Other voices">${other.map(opt).join('')}</optgroup>`;
    const wanted = voices.find(v => v.voiceURI === keep) || male[0] || other[0];
    if (wanted) voiceSel.value = wanted.voiceURI;
    note.textContent = male.length ? '' :
      'इस डिवाइस पर कोई पुरुष आवाज़ नहीं मिली। pitch कम रखा गया है ताकि आवाज़ भारी लगे।';
  }
  if (synth) { loadVoices(); synth.addEventListener('voiceschanged', loadVoices); }
  voiceSel.addEventListener('change', () => safeSet('dada.voice', voiceSel.value));

  function safeGet(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

  /* ---------- Speech output ---------- */
  function speak(text) {
    if (!synth || muted) { setState('idle'); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = PITCH;
    u.rate = RATE;
    const v = voices.find(x => x.voiceURI === voiceSel.value);
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'hi-IN'; }
    u.onstart = () => setState('speaking');
    u.onend = u.onerror = () => setState('idle');
    synth.speak(u);
  }

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? 'Sound off' : 'Sound on';
    muteBtn.setAttribute('aria-pressed', muted);
    if (muted && synth) { synth.cancel(); if (state === 'speaking') setState('idle'); }
  });

  /* ---------- Intent engine ---------- */
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const norm = s => ' ' + s.toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim() + ' ';
  const has = (t, list) => list.some(k => t.includes(k));
  const word = (t, list) => list.some(k => t.includes(' ' + k + ' '));

  const HI_DAYS = ['रविवार', 'सोमवार', 'मंगलवार', 'बुधवार', 'गुरुवार', 'शुक्रवार', 'शनिवार'];
  const HI_MONTHS = ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'];

  function timeReply() {
    const d = new Date(), h = d.getHours(), m = d.getMinutes();
    const part = h < 4 ? 'रात' : h < 12 ? 'सुबह' : h < 16 ? 'दोपहर' : h < 19 ? 'शाम' : 'रात';
    const h12 = h % 12 || 12;
    const mins = m ? ` ${m} मिनट` : '';
    return `अभी ${part} के ${h12} बजकर${mins} हुए हैं।`.replace('बजकर हुए', 'बजे हैं');
  }
  function dateReply() {
    const d = new Date();
    return `आज ${HI_DAYS[d.getDay()]} है, तारीख ${d.getDate()} ${HI_MONTHS[d.getMonth()]} ${d.getFullYear()}।`;
  }

  const JOKES = [
    'टीचर ने पूछा: बताओ, सबसे तेज़ चीज़ क्या है? बंटी बोला: मेरा रिज़ल्ट, सर! अभी परीक्षा दी और अभी फेल!',
    'पत्नी बोली: सुनो, मैं और तुम्हारा मोबाइल एक साथ डूब रहे हों तो किसे बचाओगे? पति बोला: जो वाई-फ़ाई वाला हो!',
    'एक आदमी डॉक्टर के पास गया और बोला: डॉक्टर साहब, मुझे भूलने की बीमारी है। डॉक्टर बोले: कब से? आदमी बोला: क्या कब से?',
    'पप्पू ने कंप्यूटर के सामने हाथ जोड़े। दोस्त ने पूछा: ये क्या कर रहा है? पप्पू बोला: इसने कहा था, प्रेस एनी की। अब मुझे कोई नहीं मिल रही, तो माफ़ी माँग रहा हूँ!',
    'बेटा: पापा, मुझे इंजीनियर बनना है। पापा: बेटा, पहले बिजली का बिल तो भरना सीख ले!',
    'दो प्रोग्रामर चाय पी रहे थे। एक बोला: मेरी ज़िंदगी में बग ही बग हैं। दूसरा बोला: तो डिबग कर ले। पहला बोला: कर रहा हूँ, पर हर बार नया बग निकल आता है, बिल्कुल अर्जुन के तीर की तरह!'
  ];
  let jokeBag = [];
  const nextJoke = () => { if (!jokeBag.length) jokeBag = [...JOKES].sort(() => Math.random() - .5); return jokeBag.pop(); };

  const INTENTS = [
    { name: 'bye',
      test: t => word(t, ['bye', 'tata', 'baye', 'alvida', 'बाय', 'टाटा', 'अलविदा', 'cya']) || has(t, ['see you', 'good night', 'phir milte', 'फिर मिलते', 'चलता हूँ', 'chalta hu', 'शुभ रात्रि']),
      reply: () => pick(['अलविदा भाई! अपना ध्यान रखना, फिर मिलेंगे!', 'टाटा! जब भी मन करे, दादा हमेशा यहाँ है।', 'ठीक है भाई, फिर मिलते हैं! आपका दिन शानदार रहे!']) },
    { name: 'creator',
      test: t => has(t, ['kisne banaya', 'kaun banaya', 'kisne bnaya', 'who made you', 'who created', 'who built', 'creator', 'developer', 'pratham', 'ignou', 'किसने बनाया', 'कौन बनाया', 'बनाने वाला', 'डेवलपर', 'प्रथम', 'इग्नू', 'इग्नो', 'your maker', 'made you']) || word(t, ['bca', 'बीसीए']),
      reply: () => 'मुझे प्रथम दादा ने बनाया है! वे IGNOU से BCA, यानी बैचलर ऑफ़ कंप्यूटर एप्लिकेशंस के पहले साल के छात्र हैं और एक जुनूनी सॉफ़्टवेयर डेवलपर हैं। मुझे अपने क्रिएटर पर बहुत गर्व है!' },
    { name: 'name',
      test: t => has(t, ['tumhara naam', 'tera naam', 'aapka naam', 'your name', 'who are you', 'तुम्हारा नाम', 'तेरा नाम', 'आपका नाम', 'कौन हो', 'कौन हैं आप', 'तुम कौन']),
      reply: () => 'मेरा नाम दादा है! मैं एक वॉइस असिस्टेंट हूँ, जो आपसे हिंदी, हिंग्लिश और अंग्रेज़ी में बात कर सकता है।' },
    { name: 'wellbeing',
      test: t => has(t, ['kaise ho', 'kaisa hai', 'kaise hain', 'kya haal', 'kya hal', 'how are you', 'how r u', 'whats up', 'sab theek', 'कैसे हो', 'कैसे हैं', 'कैसा है', 'क्या हाल', 'सब ठीक', 'कैसी चल']),
      reply: () => pick(['मैं एकदम बढ़िया और फुल जोश में हूँ! आप सुनाइए, कैसे हैं?', 'बिल्कुल मस्त हूँ भाई! आपसे बात करके और भी अच्छा लग रहा है।']) },
    { name: 'time',
      test: t => has(t, ['time kya', 'kitne baje', 'kya time', 'current time', 'what time', 'टाइम', 'समय', 'कितने बजे', 'बजे हैं', 'kitna baja']) || word(t, ['time', 'samay']),
      reply: timeReply },
    { name: 'date',
      test: t => has(t, ['date kya', 'aaj ki date', 'aaj ka din', 'aaj kya din', 'tarikh', 'tareekh', 'what day', 'todays date', "today's date", 'तारीख', 'तारिख', 'आज का दिन', 'आज कौन सा दिन', 'आज की डेट', 'डेट']) || word(t, ['date', 'din', 'दिन']),
      reply: dateReply },
    { name: 'joke',
      test: t => has(t, ['joke', 'chutkula', 'chutkule', 'hasao', 'hasaao', 'hansao', 'mazak', 'funny', 'जोक', 'चुटकुला', 'चुटकुले', 'हंसाओ', 'हँसाओ', 'हसाओ', 'मज़ाक', 'मजाक']),
      reply: nextJoke },
    { name: 'thanks',
      test: t => has(t, ['thank', 'shukriya', 'dhanyavad', 'शुक्रिया', 'धन्यवाद', 'थैंक']),
      reply: () => 'अरे भाई, इसमें शुक्रिया कैसा! दादा हमेशा आपकी सेवा में हाज़िर है।' },
    { name: 'greeting',
      test: t => word(t, ['hi', 'hello', 'hey', 'namaste', 'namaskar', 'hii', 'hlo', 'नमस्ते', 'नमस्कार', 'हेलो', 'हैलो', 'हाय', 'हे', 'प्रणाम', 'राम']) || has(t, ['good morning', 'good evening', 'good afternoon', 'सुप्रभात', 'राम राम']),
      reply: () => pick(['हेलो भाई! क्या हाल चाल हैं?', 'नमस्ते जी! दादा हाज़िर है, बोलिए क्या सेवा करूँ?', 'अरे वाह, आप आ गए! हेलो हेलो, कैसे हैं?']) }
  ];

  function respond(raw) {
    const t = norm(raw);
    for (const i of INTENTS) if (i.test(t)) return i.reply();
    return FALLBACK;
  }

  /* ---------- Input pipeline ---------- */
  function handleInput(text) {
    text = text.trim();
    if (!text) return;
    if (rec && state === 'listening') { try { rec.abort(); } catch {} }
    addMsg('user', text);
    const reply = respond(text);
    setTimeout(() => { addMsg('bot', reply); speak(reply); }, 250);
  }

  form.addEventListener('submit', e => { e.preventDefault(); const v = textIn.value; textIn.value = ''; handleInput(v); });

  /* ---------- Speech recognition ---------- */
  if (SR) {
    rec = new SR();
    rec.lang = 'hi-IN';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;

    rec.onstart = () => { setState('listening'); };
    rec.onresult = e => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        (e.results[i].isFinal ? (final += e.results[i][0].transcript) : (interim += e.results[i][0].transcript));
      }
      liveEl.textContent = final || interim;
      if (final) { handleInput(final); }
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        note.textContent = 'माइक की अनुमति बंद है। ब्राउज़र की सेटिंग में माइक की अनुमति दीजिए।';
      } else if (e.error === 'no-speech') {
        statusEl.textContent = 'कुछ सुनाई नहीं दिया, दोबारा बोलिए';
      } else if (e.error === 'network') {
        note.textContent = 'वॉइस पहचान के लिए इंटरनेट चाहिए। कनेक्शन जाँचिए।';
      }
    };
    rec.onend = () => { if (state === 'listening') setState('idle'); };
  } else {
    note.textContent = 'यह ब्राउज़र वॉइस इनपुट सपोर्ट नहीं करता। Chrome या Edge इस्तेमाल करें, या नीचे टाइप करें।';
  }

  micBtn.addEventListener('click', () => {
    if (state === 'speaking') { synth && synth.cancel(); setState('idle'); return; }
    if (!rec) { textIn.focus(); return; }
    if (state === 'listening') { rec.stop(); return; }
    try { synth && synth.cancel(); rec.start(); } catch {}
  });

  /* ---------- Welcome ---------- */
  addMsg('bot', 'नमस्ते! मैं दादा हूँ। माइक दबाइए और मुझसे बात कीजिए, या नीचे के सुझावों में से कुछ चुनिए।');
})();
</script>
</body>
</html>
